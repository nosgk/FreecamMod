name: Build Freecam

permissions:
  contents: write

env:
  project_name: Freecam

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0 # 下载全部 tag，供 build_info.h 的 git describe 解析版本号

    - name: Configure CMake
      run: cmake -B build -A x64

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare package
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path package/Freecam
        Copy-Item build/Release/${{ env.project_name }}.dll package/
        Copy-Item config/config.ini package/Freecam/
        Copy-Item config/zh-CN.json package/Freecam/
        Copy-Item AlibabaHealthFont2.0CN-85B.ttf package/Freecam/

    - name: Upload artifact
      if: "!startsWith(github.ref, 'refs/tags/')"
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.project_name }}
        path: package/*

    - name: Create release zip
      if: startsWith(github.ref, 'refs/tags/')
      shell: powershell
      run: |
        Compress-Archive -Path package/* -DestinationPath "${{ env.project_name }}-${{ github.ref_name }}.zip"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ env.project_name }} ${{ github.ref_name }}
        files: ${{ env.project_name }}-${{ github.ref_name }}.zip