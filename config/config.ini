; 【freecam 自由视角核心设置】
[freecam]
; 完全冻结游戏运行逻辑。开启时，周围的一切环境和动作都会静止。(true=开启, false=关闭)
freeze_game = true
; 开启时，周围的生物和敌人实体会静止不动（仅为视觉/本地效果）。(true=开启, false=关闭)
freeze_entities = true
; 开启时，玩家的角色身体会保持原地不动，不会受到重力掉落的影响。如果关闭，玩家仍然会响应跳跃等动作。(true=开启, false=关闭)
freeze_player = true
; 开启时，禁用玩家的角色输入，键盘/鼠标输入将只控制自由视角相机。(true=开启, false=关闭)
disable_player_controls = true
; （原 reset_camera_settings）开启时，每次启用自由视角时都会将摄像机的位置、旋转和FOV重置为默认值。(true=开启, false=关闭)
reset_camera_state = true

; 【game_options 游戏内选项】
; 当启用自由视角时，将临时更改这些选项。关闭自由视角后将自动恢复原始值。
[game_options]
; 开启自由视角时隐藏游戏界面(HUD)，例如准星、血条、道具栏等。(true=开启, false=关闭)
hide_hud = true
; 禁用抗锯齿 (true=开启, false=关闭)
disable_anti_aliasing = false
; 禁用动态模糊 (true=开启, false=关闭)
disable_motion_blur = false

; 【camera_settings 常规相机参数】
; 注意：新版本中所有的角度(FOV、Pitch)已改为弧度制(Radians)，不再使用角度制(Degrees)！
[camera_settings]
; 鼠标旋转视角的灵敏度。数值越小，视角转动越细腻。
sensitivity = 1.0
; 摄像机的默认移动（飞行）速度。（保留了你的旧版偏好设置）
default_speed = 1.15
; 摄像机按Q/E键左右倾斜的速度。（保留了你的旧版偏好设置）
tilt_speed = 0.1
; 配合“加速移动(sprint)”键使用时的移动速度倍率。（保留了你的旧版偏好设置）
speed_multiplier = 5.5
; 变焦（视野拉近/拉远）的速度。（保留了你的旧版偏好设置）
zoom_speed = 0.4
; 【已改为弧度制】最小视野角度。数值越小，放大效果越强。
min_fov = 0.000087
; 【已改为弧度制】最大视野角度。(2.7 弧度约等于旧版的 154.69度)
max_fov = 2.7
; 【已改为弧度制】俯仰角（上下看）的限制。设为 1.55 接近垂直。设为 0.0 则移除限制允许360度翻转。
pitch_limit = 0.0
; 【新增】反转相机的水平（X轴）旋转方向。即鼠标向左时镜头向右。(true=开启, false=关闭)
invert_camera_x = false
; 【新增】反转相机的垂直（Y轴）旋转方向。即鼠标向上时镜头向下。(true=开启, false=关闭)
invert_camera_y = false

; 【smooth_camera_settings 平滑/电影相机设置】
[smooth_camera_settings]
; 平滑相机移动。开启后松开方向键时，相机不会瞬间停止，而是带有缓冲惯性。(true=开启, false=关闭)
smooth_camera_movement = true
; 平滑相机旋转。开启后转动视角带有缓慢的缓冲惯性（类似 Minecraft 的 F8 电影视角）。(true=开启, false=关闭)
smooth_camera_rotation = true
; 在平滑模式下的鼠标灵敏度。
sensitivity = 1.0
; 在平滑模式下的镜头倾斜速度。
tilt_speed = 0.05

; 【frame_stepper 逐帧播放器】
; 在游戏冻结状态下，可以让游戏恢复运行指定的帧数。
[frame_stepper]
; 每次按下步进快捷键时，解除冻结并播放的帧数。
step = 1

; 【camera_state_manager 机位/状态管理器】
; Ctrl + 0-9 保存机位状态； 0-9 读取机位状态。
; 按住多个数字键后松开，镜头会按按下顺序进行连续的平滑插值过渡切换。
[camera_state_manager]
; 多个保存的机位之间平滑过渡（插值）所需要的时间，单位为秒。
interpolation_time = 3.2

; 【input 输入控制选项】(新功能)
[input]
; 禁用手柄控制器输入，防止操作自由视角时误触到游戏内的角色。(true=禁用, false=不禁用)
disable_controller = false
; 禁用键盘输入。(true=禁用, false=不禁用)
disable_keyboard = false

; 【features_work_only_in_freecam 仅在自由视角下生效的功能】(新功能)
[features_work_only_in_freecam]
; 仅在自由视角开启时，才允许通过快捷键循环切换天气和时间。(true=开启, false=关闭)
cycle_weather_time = true
; 仅在自由视角开启时，才允许使用游戏全局加速/减速(Speedhack)功能。(true=开启, false=关闭)
speedhack = true

; 【gui 图形用户界面设置】(新功能)
; 控制模组内置图形菜单和屏幕通知的显示逻辑。
[gui]
; 启动游戏时是否自动显示模组的图形菜单。(true=开启, false=关闭)
show_menu_on_startup = true
; 启用左上角的通知提示总开关。(true=开启, false=关闭)
enable_notifications = true
; 以下为各类操作的具体提示开关（true表示操作时在屏幕上显示提示文字）：
notify_freecam = false             ; 提示：开启/关闭自由视角
notify_speedhack = true            ; 提示：改变游戏速度 (Speedhack)
notify_frame_stepped = true        ; 提示：逐帧步进操作
notify_cycle_weather_time = true   ; 提示：切换天气和时间
notify_record = true               ; 提示：开始/停止录像路径
notify_play_record = true          ; 提示：播放录像路径
notify_save_state = true           ; 提示：保存相机机位状态
notify_interpolate = true          ; 提示：触发机位平滑过渡(插值)
notify_state_queued = false        ; 提示：机位状态已加入过渡队列

; 【keybinds 快捷键绑定设置】
; 快捷键文档可参考：https://github.com/Logersnamed/FreecamMod/wiki	
; 注：组合键使用 "+" 连接，"!" 代表非（必须不按某键）。
[keybinds]
; 开启/关闭自由视角 (Toggle)
toggle = F1
; 【新增】打开/关闭内置的图形化控制菜单 (GUI)
toggle_menu = END
; 重新读取此配置文件 config.ini
reload_config = F5
; 重置自由视角相机的速度和角度参数
reset_settings = R + !CTRL
; 切换冻结状态 (暂停/恢复游戏)
toggle_freeze = P
; 将玩家角色传送到当前相机的坐标位置
teleport_to_camera = F3
; 循环切换天气和时间
cycle_weather_time = F4
; 彻底卸载并退出模组功能 (更新为新版默认快捷键)
exit_mod = CTRL + DELETE

; --- 路径录制系统 ---
; 开始/停止录制当前自由视角的机位路径
start/end_recording = F8
; 开始/停止播放录制的机位路径（已修复旧版的 strat 拼写错误）
start/end_playing_recording = F9
; 触发“逐帧步进”的按键，需配合 [frame_stepper] 使用
step_frames = F2

; --- 相机移动控制 ---
move_forward = W           ; 向前移动
move_backward = S          ; 向后移动
move_left = A              ; 向左平移
move_right = D             ; 向右平移
move_up = SPACE            ; 垂直向上飞
move_down = SHIFT          ; 垂直向下飞
sprint = LBUTTON           ; 按住时加速移动（左键）
zoom_in = 0xBB             ; 拉近视野/放大 ("+"号键)
zoom_out = 0xBD            ; 拉远视野/缩小 ("-"号键)
tilt_left = Q              ; 镜头向左倾斜
tilt_right = E             ; 镜头向右倾斜

; --- 鼠标滚轮修饰键 ---
; 按住CTRL并滚动鼠标滚轮时，调整 FOV（视野大小）
scroll_zoom_modifier = CTRL
; 不按CTRL且不按V滚动鼠标滚轮时，调整相机的移动速度
scroll_camera_speed_modifier = !CTRL + !V

; --- 游戏全局速度控制 (Speedhack) ---
; 【新增】按住 V 键并滚动鼠标滚轮，调整游戏全局运行速度
scroll_speedhack_modifier = V
; 【新增】开启/关闭速度修改功能
toggle_speedhack = F7
; 【新增】重置游戏速度为 1.0 正常倍速
reset_speedhack_speed = CTRL + V

; --- 基于关键帧的相机动画音序器/时间轴 (Timeline) ---
; 【新增】播放/暂停时间轴上的关键帧动画
timeline_play_pause = SPACE
; 【新增】在时间轴上添加所有的关键帧
timeline_add_all_keyframes = O
; 【新增】删除在时间轴上选中的关键帧
timeline_delete_selected_keyframes = X
; 【新增】全选时间轴上的所有关键帧
timeline_select_all_keyframes = CTRL + A